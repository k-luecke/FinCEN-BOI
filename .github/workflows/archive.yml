name: Scheduled archive crawl

on:
  schedule:
    # Daily, off the top of the hour to be polite to shared cron load.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      seeds_file:
        description: "Seed list to crawl (e.g. discovered-seeds.txt)"
        default: "seeds.txt"
        type: string
      delay:
        description: "Seconds between requests"
        default: "2.0"
        type: string
      follow_links:
        description: "Follow allowlisted same-host links from HTML to closure"
        default: false
        type: boolean
      max_pages:
        description: "Total fetch cap when following links"
        default: "20000"
        type: string

permissions:
  contents: write

concurrency:
  group: archive-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl seed set
        # Scheduled runs have no inputs; fall back to the defaults.
        env:
          SEEDS_FILE: ${{ inputs.seeds_file || 'seeds.txt' }}
          DELAY: ${{ inputs.delay || '2.0' }}
          FOLLOW_LINKS: ${{ inputs.follow_links && 'true' || 'false' }}
          MAX_PAGES: ${{ inputs.max_pages || '20000' }}
        run: |
          EXTRA=""
          if [ "$FOLLOW_LINKS" = "true" ]; then
            EXTRA="--follow-links --max-pages $MAX_PAGES"
          fi
          python3 archive.py \
            --seeds "$SEEDS_FILE" \
            --delay "$DELAY" \
            $EXTRA \
            --out archive \
            --manifest run-manifest.jsonl

      - name: Require at least one successful retrieval
        # A run where every fetch failed is a runner/network problem,
        # not evidence that every public record vanished at once.
        # Fail loudly instead of poisoning the ledger with REMOVED.
        run: |
          python3 - <<'EOF'
          import json, sys

          ok = 0
          with open("run-manifest.jsonl", encoding="utf-8") as f:
              for line in f:
                  if json.loads(line).get("sha256"):
                      ok += 1

          print(f"Successful retrievals this run: {ok}")
          sys.exit(0 if ok else 1)
          EOF

      - name: Verify this run's objects
        run: python3 verify.py --manifest run-manifest.jsonl

      - name: Archive objects to durable release storage
        # Bytes stay out of git history. Each run's content-addressed
        # object store is published as release assets — durable, no
        # retention expiry, and tar paths match the object_path values
        # recorded in manifest.jsonl. Assets over the 2 GB per-file
        # limit are split; reassemble with `cat`.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SEEDS_FILE: ${{ inputs.seeds_file || 'seeds.txt' }}
        run: |
          set -euo pipefail
          tag="objects-run-${RUN_ID}"
          tarball="objects-${RUN_ID}.tar.zst"
          tar --zstd -cf "$tarball" archive
          size=$(stat -c%s "$tarball")
          objects=$(find archive/objects -type f | wc -l)
          if [ "$size" -gt 1900000000 ]; then
            split -d -b 1900M "$tarball" "$tarball.part"
            assets="$tarball".part*
            note="Split tarball: reassemble with \`cat $tarball.part* > $tarball\`."
          else
            assets="$tarball"
            note="Single tarball."
          fi
          gh release create "$tag" \
            --title "Archive objects $(date -u +%Y-%m-%d) (run ${RUN_ID})" \
            --notes "$objects content-addressed objects crawled from ${SEEDS_FILE}. Tar paths match manifest.jsonl object_path values. ${note}" \
            $assets
          # DURABLY_ARCHIVED means the asset verifiably exists.
          asset_count=$(gh release view "$tag" --json assets --jq '.assets | length')
          if [ "$asset_count" -lt 1 ]; then
            echo "Release $tag has no assets — durability NOT confirmed."
            exit 1
          fi
          echo "Release $tag confirmed with $asset_count asset(s)."

      - name: Commit collection state
        # Merges this run's records onto the LATEST main at commit
        # time with bounded push retry — no rebase conflicts when
        # concurrent runs also touch manifest.jsonl.
        env:
          METRICS_FLAGS: --release-verified
        run: >
          ./scripts/commit_state.sh run-manifest.jsonl
          "Archive crawl $(date -u +%Y-%m-%d): update manifest, ledger, queue, metrics"
