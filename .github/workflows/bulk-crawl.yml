name: Bulk chunked crawl

# Crawl a large seed list (e.g. the full discovered-seeds.txt) split
# into host-aligned chunks that run as parallel jobs, each within the
# 6-hour job limit. Hosts are never split across chunks, so parallel
# jobs never hit the same site and per-host rate limits hold. A final
# job merges all chunk manifests, rebuilds the ledger, publishes one
# combined durable release, and commits.

on:
  workflow_dispatch:
    inputs:
      pending_only:
        description: "Crawl only never-attempted/retry-eligible URLs from the queue"
        default: true
        type: boolean
      seeds_file:
        description: "Seed list when pending_only is off"
        default: "discovered-seeds.txt"
        type: string
      exclude_hosts:
        description: "Comma-separated hosts to hold back (e.g. pending audit)"
        default: ""
        type: string
      delay:
        description: "Seconds between requests (per chunk = per host set)"
        default: "1.0"
        type: string
      target_chunk_size:
        description: "Approximate URLs per chunk"
        default: "4000"
        type: string
      follow_links:
        description: "Follow allowlisted same-host links from HTML"
        default: false
        type: boolean
      max_pages:
        description: "Per-chunk fetch cap (bounded checkpoint; remainder stays pending)"
        default: "12000"
        type: string

permissions:
  contents: write

concurrency:
  group: bulk-crawl
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Partition seeds into host-aligned chunks
        id: chunk
        env:
          PENDING_ONLY: ${{ inputs.pending_only && 'true' || 'false' }}
          SEEDS_FILE: ${{ inputs.seeds_file }}
          EXCLUDE: ${{ inputs.exclude_hosts }}
          TARGET: ${{ inputs.target_chunk_size }}
        run: |
          if [ "$PENDING_ONLY" = "true" ]; then
            python3 queue.py \
              --queue-out queue-plan.jsonl \
              --pending-out plan-seeds.txt \
              --limit 500000
          else
            cp "$SEEDS_FILE" plan-seeds.txt
          fi
          matrix=$(python3 chunk_seeds.py \
            --seeds plan-seeds.txt \
            --out-dir chunks \
            --target "$TARGET" \
            --exclude-hosts "$EXCLUDE" \
            --print-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: seed-chunks
          path: chunks/
          if-no-files-found: error

  crawl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Chunks are host-disjoint, so parallelism scales throughput
      # across independent hosts without concentrating load on any
      # one site — per-host rate stays one polite crawler.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: seed-chunks
          path: chunks/

      - name: Crawl chunk
        env:
          CHUNK: ${{ matrix.chunk }}
          DELAY: ${{ inputs.delay }}
          FOLLOW_LINKS: ${{ inputs.follow_links && 'true' || 'false' }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          # --max-pages always applies: an oversized single-host chunk
          # crawls a bounded batch, checkpoints durably, and leaves the
          # remainder pending for the next dispatch — instead of
          # blowing the job timeout with nothing preserved.
          EXTRA="--max-pages $MAX_PAGES"
          if [ "$FOLLOW_LINKS" = "true" ]; then
            EXTRA="$EXTRA --follow-links"
          fi
          python3 archive.py \
            --seeds "chunks/$CHUNK.txt" \
            --delay "$DELAY" \
            $EXTRA \
            --out archive \
            --manifest "run-manifest-$CHUNK.jsonl"

      - name: Verify chunk objects
        run: python3 verify.py --manifest "run-manifest-${{ matrix.chunk }}.jsonl"

      - uses: actions/upload-artifact@v4
        with:
          name: crawl-${{ matrix.chunk }}
          path: |
            run-manifest-${{ matrix.chunk }}.jsonl
            archive/
          if-no-files-found: error

  aggregate:
    needs: crawl
    # Run even if some chunks failed, so completed chunks still land;
    # the guard below requires at least one successful retrieval.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: crawl-chunk-*
          merge-multiple: true

      - name: Merge chunk manifests and rebuild ledger
        run: |
          cat run-manifest-chunk-*.jsonl > run-manifest.jsonl
          python3 - <<'EOF'
          import json, sys

          ok = 0
          total = 0
          with open("run-manifest.jsonl", encoding="utf-8") as f:
              for line in f:
                  total += 1
                  if json.loads(line).get("sha256"):
                      ok += 1

          print(f"Merged {total} records, {ok} successful retrievals")
          sys.exit(0 if ok else 1)
          EOF
          python3 verify.py --manifest run-manifest.jsonl

      - name: Archive objects to durable release storage
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SEEDS_FILE: ${{ inputs.seeds_file }}
        run: |
          set -euo pipefail
          tag="objects-run-${RUN_ID}"
          tarball="objects-${RUN_ID}.tar.zst"
          tar --zstd -cf "$tarball" archive
          size=$(stat -c%s "$tarball")
          objects=$(find archive/objects -type f | wc -l)
          if [ "$size" -gt 1900000000 ]; then
            split -d -b 1900M "$tarball" "$tarball.part"
            assets="$tarball".part*
            note="Split tarball: reassemble with \`cat $tarball.part* > $tarball\`."
          else
            assets="$tarball"
            note="Single tarball."
          fi
          gh release create "$tag" \
            --title "Bulk crawl objects $(date -u +%Y-%m-%d) (run ${RUN_ID})" \
            --notes "$objects content-addressed objects from a chunked crawl of ${SEEDS_FILE}. Tar paths match manifest.jsonl object_path values. ${note}" \
            $assets
          # DURABLY_ARCHIVED means the asset verifiably exists.
          asset_count=$(gh release view "$tag" --json assets --jq '.assets | length')
          if [ "$asset_count" -lt 1 ]; then
            echo "Release $tag has no assets — durability NOT confirmed."
            exit 1
          fi
          echo "Release $tag confirmed with $asset_count asset(s)."

      - name: Commit collection state
        env:
          METRICS_FLAGS: --release-verified
        run: >
          ./scripts/commit_state.sh run-manifest.jsonl
          "Bulk chunked crawl $(date -u +%Y-%m-%d): update manifest, ledger, queue, metrics"
