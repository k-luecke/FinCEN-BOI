name: Shard oversized manifest

# One-shot migration: split manifest.jsonl (over GitHub's 100 MB blob
# cap) into manifest/part-*.jsonl so scheduled crawls can push again.
# Safe to re-run after shards already exist — it no-ops if part-*.jsonl
# is already in the tree. Daily crawls also split on first append via
# commit_state.sh; this workflow is for not waiting until the next cron.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-crawl
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Split monolith if present
        run: |
          set -euo pipefail
          python3 -m manifest_store split
          python3 -m manifest_store guard
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest
          git rm -f --ignore-unmatch manifest.jsonl
          if git diff --cached --quiet; then
            echo "Ledger already sharded; nothing to commit."
            exit 0
          fi
          git commit -m "Shard manifest.jsonl under GitHub's 100 MB file limit"
          git push origin HEAD:main
