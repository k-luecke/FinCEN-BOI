name: Content Pass 1 (derived reconnaissance artifacts)

# Reproduces Content Pass 1 from the archived release bytes and publishes
# the derived artifacts (extracted text, container indexes, boilerplate
# models, full candidate indexes) as a durable release. Touches no
# government host: every input byte comes from this repository's own
# objects-run-* releases. Derived text is reproducible and therefore
# lower durability priority than the original source bytes.

on:
  workflow_dispatch:
    inputs:
      object_release_tags:
        description: "Space-separated objects-run-* release tags to restore"
        default: "objects-run-31863450182 objects-run-31863924882 objects-run-31870874176 objects-run-31878498784 objects-run-31887678820 objects-run-31891026640 objects-run-31891027794 objects-run-31932912608 objects-run-31943091401 objects-run-32005819978 objects-run-32023003839 objects-recovery-31900590641 objects-recovery-31907896731 objects-recovery-31982149543"
        type: string

permissions:
  contents: write

concurrency:
  group: content-pass-1
  cancel-in-progress: false

jobs:
  pass1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zstd poppler-utils
          pip install --quiet beautifulsoup4 lxml

      - name: Free runner disk space
        run: |
          # The full corpus (~27 GB extracted) plus derived text does not fit
          # beside the runner's preinstalled toolchains. Objects are
          # content-addressed, so re-extracting overlapping releases is safe.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Restore archived objects from releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.object_release_tags }}
        run: |
          set -euo pipefail
          # One release at a time: download, reassemble split parts, extract,
          # delete — bounds peak disk to extracted-objects + one release.
          for tag in $TAGS; do
            rm -rf restore && mkdir -p restore
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir restore
            ( cd restore
              for stem in $(ls *.tar.zst.part00 2>/dev/null | sed 's/\.part00$//'); do
                cat "$stem".part* > "$stem"
                rm -f "$stem".part*
              done )
            for t in restore/*.tar.zst; do
              zstd -dc "$t" | tar -x
              rm -f "$t"
            done
            rm -rf restore
            echo "restored $tag"
          done
          find archive/objects -type f | wc -l
          du -sh archive
          df -h /

      - name: Run Content Pass 1
        run: |
          set -euo pipefail
          python3 -m content_pass_1.inventory
          python3 -m content_pass_1.extract --workers 4
          python3 -m content_pass_1.scan boilerplate
          python3 -m content_pass_1.scan scan --workers 4
          python3 -m content_pass_1.buckets
          python3 -m content_pass_1.dedup
          python3 -m content_pass_1.finalize
          python3 -m content_pass_1.qc
          python3 -m content_pass_1.metrics_report metrics
          python3 -m content_pass_1.metrics_report top

      - name: Package derived artifacts
        run: |
          set -euo pipefail
          tar -c derived | zstd -19 -T0 -o derived-content-pass-1.tar.zst
          tar -c content-pass-1 | zstd -19 -T0 -o content-pass-1-indexes.tar.zst
          sha256sum derived-content-pass-1.tar.zst content-pass-1-indexes.tar.zst \
            | tee derived-sha256sums.txt
          # Stay under the 2 GB release-asset limit.
          split -b 1900M -d --additional-suffix= derived-content-pass-1.tar.zst \
            derived-content-pass-1.tar.zst.part || true
          if ls derived-content-pass-1.tar.zst.part* >/dev/null 2>&1; then
            rm derived-content-pass-1.tar.zst
          fi

      - name: Publish derived release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="derived-pass1-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Content Pass 1 derived artifacts (run ${GITHUB_RUN_ID})" \
            --notes "Derived reconnaissance artifacts reproduced from the objects-run-* releases: extracted text (derived/text), container indexes, boilerplate models, and full candidate indexes. Reproducible; original source bytes remain the primary archival asset. See content-pass-1/SCHEMA.md." \
            derived-sha256sums.txt \
            derived-content-pass-1.tar.zst* \
            content-pass-1-indexes.tar.zst
